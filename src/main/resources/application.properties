# Random free port locally; override for real deployments.
server.port=0

# How long an async (CompletableFuture / startAsync) request may run before the
# container times it out. The TraceFilter records an "async-timeout" node and
# still completes the trace when this fires.
spring.mvc.async.request-timeout=2000

# Number of finished traces retained in memory for post-mortem lookup.
# Bounded by design: oldest traces are evicted once the limit is reached.
tracing.recent-capacity=200

# Actuator: health and metrics are exposed alongside our /observability API.
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
